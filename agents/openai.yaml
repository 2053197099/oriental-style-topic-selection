interface:
  display_name: "东方风格选题"
  short_description: "推荐东方人物与妖兽异种题材，建立多样生命共存的世界观及配套场景"
  default_prompt: "使用 $oriental-style-topic-selection 根据我的创作目标，从影视、动画、游戏、小说、抖音、小红书等媒体内容或我提供的作品素材中推荐 2–3 个有差异的东方题材并说明参考依据，主动考虑人物、山海妖兽及非人形奇异生命，等我选择后建立符合题材的简短世界观，给出十个在形态、尺度及生态或社会功能上有真实差异的角色，以及十个匹配其生存方式与世界规则的场景方向，以独立无序号代码块交付，不生成提示词。"
