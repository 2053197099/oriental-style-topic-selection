interface:
  display_name: "东方风格选题"
  short_description: "推荐东方题材，交付简短世界观及带精简描述的角色与配套场景"
  default_prompt: "使用 $oriental-style-topic-selection 根据我的创作目标，从影视、动画、游戏、小说、抖音、小红书等媒体内容或我提供的作品素材中推荐 2–3 个有差异的东方题材并说明参考依据，主动考虑人物、山海妖兽及非人形奇异生命；人形态包含拟人生物，不限定为人类。等我选择后，从适合题材的生命、环境或文化关系起步建立简短世界观；以少量共同视觉特征连接不同角色与场景，按智慧生命的诉求或自然生物的习性建立关系，不强制特殊机制。给出十个有真实差异的角色及十个匹配其生存方式与世界设定的场景方向，分别使用独立无序号代码块，每行按“名称：一句精简描述”交付，不生成提示词。"
